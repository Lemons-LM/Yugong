# Template Processor Example
introduction = "This is a template processor example" # Basic Intro
apply_websites = ["example.com"] # Leave empty to apply to all websites
names = ["<NAME>", "<NAME>"] # List of names, the first one is the preferred one. You do NOT add the capitalized and uncapitalized one

[template_level]
rename = true # Whether change the name to the preffered one
delete = true # Whether delete the element
replace = "{{{foo|{{{1}}}}}}" # Replace as str. Use {{{foo}}} as parameter name, | as separator to "if none"
recursive = false # Whether recursive

[[params]] # Named Parameter
names = ["<NAME>", "<NAME>"] # List of names, you may use regex, the first one is the preferred one. Use 1 as annoymous para 1
new_name = "<NAME>" # New name if rename
rename = true # Whether change the name to the preffered one
delete = true # Whether delete the param

[[params.match]]
condition = "" # Regex to match
mode = true # Mode, true means matched, default to true
match = "" # Regex replacement to match
replacement = "" # Regex replacement to replace