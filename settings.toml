# YuGong configuration.
#
# Every key is optional except api_endpoint plus one of the "# About Task"
# selectors; anything left out falls back to the defaults in
# src/Yugong/core/settings.py.
#
# `python main.py` validates this file before touching the wiki and refuses to
# start with a descriptive message if something is missing or contradictory.

# ── Wiki connection ──────────────────────────────────────────────────────────
# The wiki URL.  Either the directory holding api.php / index.php / rest.php
# (with or without a trailing slash), or the api.php URL itself — both are
# accepted and normalised.  Qiuwen's default is below; change it for another
# wiki.
api_endpoint = "https://www.qiuwenbaike.cn/"
# Leave these commented out to use the defaults from core/settings.py.  If you
# override them, keep a real User-Agent with a contact address: many WAFs and
# MediaWiki installations reject empty or generic agents.
# user_agent = "Yugong/1.0 (your-name; you@example.com)"
# user_agent_check = "Yugong/1.0 (Check suppressed)"
# Only OAuth is supported, so this must stay true.  Put the access token in the
# MW_OAUTH_TOKEN environment variable (never in this file).
is_owner_only = true
bot_name = "Lemonade-bot"
wiki_domain = "www.qiuwenbaike.cn"
# Language code and pywikibot family name the Site is built from.
wiki_lang = "zh"
wiki_family = "qiuwen"
# Name of the cache file cache/<wiki_tag>.json.  Use a different tag per wiki so
# their todo lists do not mix.
wiki_tag = "wiki"

# ── About Task (set at least one) ────────────────────────────────────────────
# Page-id range.  page_id_start = 0 disables this selector; page_id_end = 0 means
# "just page_id_start".  The span is capped by MAX_PAGEID_SPAN (5000).
# page_id_start = 0
# page_id_end = 0
# Or: every page transcluding this template (without the "Template:" prefix).
# linked_template = ""
# Or: every member of this category (without the "Category:" prefix).
category = "YuGong one-off test 2026-11-23"

# ── Settings / behaviour ─────────────────────────────────────────────────────
# true = robot mode, no prompts.
bypass_confirm_settings = false
# true = save edits directly; false = copy to the clipboard and open the editor.
submit_changes = false
# Allow template rules to rename templates / parameters.
overwrite_template_name = true
overwrite_para_name = true
# Cangjie: convert visible article text to zh-cn using the page's NoteTA/
# CGroup rules, then OpenCC.  Pages without NoteTA still get the OpenCC
# script-level conversion.  Categories are handled separately by
# category_handler.  Requires the NoteTA groups to be readable by the bot.
enable_cangjie = true
# ISBN normaliser: hyphenate ISBN-10/13 in {{ISBN}}/{{ISBNT}}/citation
# templates with the International ISBN Agency range data, and clean up
# Special:BookSources links.  Off by default; enable it deliberately.
enable_isbn_normalise = false
# Template convention.  The two wikis interpret {{ISBN}} differently:
#   "qiuwen"  — {{ISBN|isbn1|isbn2|…|isbn9}}; parameters 1–9 are all ISBNs,
#               with plainlink=/leadout=/invalid1..9= as named options.
#   "moegirl" — {{ISBN|isbn|display text}}; parameter 2 is a display label.
# Qiuwen is the default because this repository targets Qiuwen.
isbn_template_style = "qiuwen"
# Convert valid ISBN-10 values to ISBN-13 while normalising.
isbn_convert_10_to_13 = false
# Only used by the "moegirl" style: when parameters 1 and 2 are the same ISBN,
# collapse {{ISBN|isbn|isbn}} to {{ISBNT|isbn}}.
isbn_rehyphenate_equal_label = false
# Template names (without "Template:") handled by the ISBN job.  Empty means
# the defaults for the selected style:
#   qiuwen  -> ISBN, ISBNT, Cite book, Citation
#   moegirl -> ISBN, ISBNT, Cite book
isbn_template_names = []
# Path to RangeMessage.xml relative to the project root; empty uses the bundled
# src/Yugong/resources/RangeMessage.xml.
isbn_range_message_path = ""
# Invisible Unicode cleanup: remove zero-width/format/control characters from
# text, template names/parameters, links and tag attributes.  nowiki/code/math
# contents and HTML comments are skipped.  Off by default.
enable_invisible_chars_fix = false
# Also remove characters that are meaningful in some scripts: ZWNJ/ZWJ
# (emoji/Indic/Persian), bidi marks/controls and the Arabic letter mark.
# Leave false unless you know the wiki does not use them.
invisible_chars_aggressive = false
# true = refuse to run twice on the same UTC day (for cron/robot deployments).
enable_heartbeat = false
# Every edit is tagged with this comment, so it must identify the bot.
edit_comment = "Edited by Yugong (gh:Lemons-LM/Yugong) program"

# ── Safety limits ────────────────────────────────────────────────────────────
# Tag policy: use safe_tag_list (allow-list) OR unsafe_tag_list (deny-list),
# never both.  Both empty means "do not restrict tags".
safe_tag_list = []
unsafe_tag_list = []
# What to do when a page uses a tag the policy forbids:
#   true  = abort the whole run (default, fail loudly)
#   false = skip that page and report it
is_dangerous_tag_unacceptable = true
# Reject an edit whose changed-character count exceeds this.  The shipped
# {{國家基礎資訊}} -> {{Infobox country}} rule expands to a large call (about
# 3.5k changed characters), so raise this if you intend to use that rule.
max_acceptable_diff_size = 1000
# Retries per API request, and the per-request timeout in seconds.
request_max_tries = 3
request_timeout = 30

# ── Notifications and logging ────────────────────────────────────────────────
mail_recipients = []
# 0=CRITICAL, 1=ERROR, 2=WARNING, 3=INFO, 4=DEBUG
log_level = 3
log_timestamp = true
