[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "yugong"
version = "0.1.0"
description = "Automated wiki editing tool for batch processing"
requires-python = ">=3.10"

dependencies = [
    "requests==2.33.1",
    "toml==0.10.2",
    "beautifulsoup4==4.14.3",
    "mwparserfromhell==0.7.2",
    "opencc==1.4.2",
    "pyperclip==1.11.0",
    "pywikibot==11.5.0",
]

[project.optional-dependencies]
dev = [
    "mypy==1.19.1",
    "mypy_extensions==1.1.0",
    "types-requests",
]

# The code imports ``src.Yugong...`` from the repository root, so the packages are
# declared explicitly instead of being discovered under src/ — discovery would
# install them as a top-level ``Yugong`` package and break every import.
[tool.setuptools]
package-dir = { "" = "." }
packages = [
    "src",
    "src.Yugong",
    "src.Yugong.core",
    "src.Yugong.processor",
    "src.Yugong.utilities",
    "src.Yugong.extensions",
]

# RangeMessage.xml is read at runtime by utilities/isbn.py.
[tool.setuptools.package-data]
"src.Yugong" = ["resources/*.xml"]

[tool.mypy]
python_version = "3.10"
files = ["src", "tests", "main.py"]
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

# These dependencies ship no type information at all.  They are reached through
# our own typed wrappers, so stub packages would add dependencies for no benefit;
# ``follow_untyped_imports`` treats them as untyped instead of reporting them.
[[tool.mypy.overrides]]
module = [
    "toml",
    "toml.*",
    "pywikibot",
    "pywikibot.*",
    "pyperclip",
    "opencc",
    "opencc.*",
]
ignore_missing_imports = true
follow_untyped_imports = true
