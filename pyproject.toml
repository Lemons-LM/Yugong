[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "yugong"
version = "0.1.0"
description = "Automated wiki editing tool for batch processing"
requires-python = ">=3.10"

# 核心运行时依赖
dependencies = [
    "requests==2.33.1",
    "toml==0.10.2",
    "beautifulsoup4==4.14.3",
    "mwparserfromhell==0.7.2",
    "pyperclip==1.11.0",
    "pywikibot==11.5.0",
]

[project.optional-dependencies]
# 开发工具依赖
dev = [
    "mypy==1.19.1",
    "mypy_extensions==1.1.0",
    "types-requests", # 建议添加，用于 mypy 类型检查
]

[tool.setuptools.packages.find]
where = ["src"]

# 可选：如果你使用 mypy，可以在此处添加基本配置
[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true